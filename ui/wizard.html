<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiftOff setup</title>
<style>
:root{--ink:#0E1726;--mut:#46526A;--line:#D5DBE6;--bg:#F3F5F8;--card:#fff;--acc:#1F4FD8;--bad:#B42318;--ok:#0B6B3A;--ring:#BFD0FF}
@media (prefers-color-scheme:dark){:root{--ink:#E6ECF7;--mut:#A9B5CC;--line:#2B3750;--bg:#0B1220;--card:#121B2E;--acc:#7AA2FF;--bad:#FF8A80;--ok:#4ADE80;--ring:#27407F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{padding:16px 32px;background:#0E1726;color:#fff;display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
header small{color:#B6C0D4}
header a{color:#B6C0D4;font-size:13px}
main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
.dots{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.dot{height:6px;flex:1 1 40px;border-radius:3px;background:var(--line)}.dot.on{background:var(--acc)}.dot.done{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.eyebrow{font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.04em;text-transform:uppercase}
.lede,.hint{color:var(--mut)}.hint{font-size:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f>label,.lab{font-weight:600;font-size:15px}
.in{width:100%;min-height:44px;padding:8px 14px;border:1px solid #C3CAD6;border-radius:10px;background:var(--card)}
textarea.in{min-height:150px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.in:focus,button:focus-visible{outline:3px solid var(--ring);outline-offset:1px;border-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:12px}.row>*{flex:1 1 200px}
.btn{height:44px;padding:0 20px;border-radius:10px;border:1px solid #C3CAD6;background:var(--card);font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{height:36px;font-size:13px;padding:0 14px}
.foot{display:flex;gap:12px;justify-content:space-between;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.note{padding:14px 16px;border-radius:12px;font-size:15px}
.n-info{background:#E7EEFF;color:#173DAA}.n-warn{background:#FFF4E5;color:#7A2E0E}.n-bad{background:#FDE8E6;color:#8F1D12}.n-ok{background:#E3F5EA;color:#0A4D2A}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opt input{margin-top:5px}
.sub{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all}
ul.files{margin:0;padding-left:20px}
</style>
</head>
<body>
<header><div><b>LiftOff</b> <small id="who">Setup</small></div><a id="panel" href="#">Open the full control panel</a></header>
<main><div class="dots" id="dots"></div><section class="card" id="app">Loading…</section></main>
<script>
"use strict";
const TOKEN = "__TOKEN__";
history.replaceState(null, "", location.pathname);
document.getElementById("panel").href = "/?t=" + TOKEN + "&view=panel";

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: Object.assign({ "x-liftoff-token": TOKEN }, body !== undefined ? { "content-type": "application/json" } : {}), body: body !== undefined ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ ok: false, message: "The panel did not answer." }));
  return Object.assign({ status: r.status }, j);
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const csv = (s) => String(s || "").split(",").map((x) => x.trim()).filter(Boolean);
const heads = (t) => [...String(t).matchAll(/^#{1,6}\s+(.+?)\s*$/gm)].map((m) => m[1]);
const guessAc = (t) => { const h = heads(t); return h.find((x) => /accept/i.test(x)) || h[0] || "Acceptance criteria"; };
// What kind of change a ticket type usually is, in the words of conventional commits (the start of a merge request title).
const COMMITS = [["feat", "A new feature"], ["fix", "A bug fix"], ["chore", "Maintenance or a task"], ["docs", "Documentation"], ["refactor", "A refactoring"], ["test", "Tests"]];
const guessCommit = (n) => (/bug|fix|defect|incident/i.test(n) ? "fix" : /task|chore|maint|support|e2e|test/i.test(n) ? "chore" : "feat");
const branchOf = (commit) => (commit === "feat" ? "feature" : commit === "fix" ? "bugfix" : "chore");
const commitOf = (t) => t.commitType || (t.branchType === "feature" ? "feat" : t.branchType === "bugfix" ? "fix" : "chore");

let S = null;          // what the panel knows
let W = null;          // the wizard's own state
let step = 0, busy = false, msg = null, constraints = "";

function init(s) {
  S = s;
  const c = s.config || {}, d = s.detected || {};
  W = {
    stage: s.stage,
    name: c.project?.name || d.name || "", purpose: "",
    url: c.tracker?.url || "", project: c.tracker?.project || "", token: "", own: false, wsMade: false, insecure: c.tracker?.server?.sslVerify === false, projects: null, manual: false, filter: "", local: false, found: [], typesFor: "", later: false, saveOnly: false, saveStage: "", brain: "off", addName: "", addBase: "", typesNote: "", loadedTl: false,
    types: [],
    modules: (d.modules || []).map((m) => ({ id: m.id, path: m.path, languages: (m.languages || []).join(", "), frameworks: (m.frameworks || []).join(", "), build: m.build || "", test: m.test || "", lint: m.lint || "" })),
    languages: (c.stack?.languages || d.languages || []).join(", "), frameworks: (c.stack?.frameworks || d.frameworks || []).join(", "),
    targets: c.agents?.targets || ["claude-code"], git: c.build?.git || "assisted",
    host: c.codeHost?.host || d.git?.host || "", conv: { targetBranch: c.codeHost?.conventions?.targetBranch || d.git?.defaultBranch || "main", branchPattern: c.codeHost?.conventions?.branchPattern || "{type}/{key}-{slug}", titlePattern: c.codeHost?.conventions?.titlePattern || "{commitType}({key}): {summary}", labels: "", reviewers: "" },
    created: null, preview: null, saved: null,
    excl: [...(c.workspace?.exclude || [])], // repositories of a workspace LiftOff leaves alone
  };
  if (c.modules?.items?.length) W.modules = c.modules.items.map((m) => Object.assign({ languages: "", frameworks: "", build: "", test: "", lint: "" }, { id: m.id, path: m.path }));
  if (s.stage === "tl") W.types = fromConfigTypes();
  document.getElementById("who").textContent = s.stage === "po" ? "Setup, step 1 of 2: the project and its tickets" : s.stage === "tl" ? "Setup, step 2 of 2: the technical side" : "Setup";
}

// ---------- steps
const PO = ["welcome", "project", "jira", "types", "templates", "review", "save"];
const TL = ["welcome", "tech", "agents", "types", "templates", "gitlab", "quality", "brain", "review", "save"];
const steps = () => (W.stage === "po" ? PO : TL.filter((x) => x !== "templates" || W.types.some((t) => t.on && !t.locked)));

function dots() {
  document.getElementById("dots").innerHTML = steps().map((_, i) => `<div class="dot ${i < step ? "done" : i === step ? "on" : ""}"></div>`).join("");
}
const older = (have, need) => { const [a, b] = [have, need].map((v) => String(v).split(".").map(Number)); return a[0] < b[0] || (a[0] === b[0] && (a[1] || 0) < (b[1] || 0)); };
const note = () => (msg ? `<div class="note n-${msg.kind}" role="status">${esc(msg.text)}</div>` : "");
const nav = (next, label = "Continue", ok = true) => `<div class="foot">${step > 0 ? `<button class="btn" data-act="back">Back</button>` : "<span></span>"}${next ? `<button class="btn pri" data-act="${next}" ${ok && !busy ? "" : "disabled"}>${busy ? "One moment…" : label}</button>` : ""}</div>`;
const titleFor = (t) => String(W.conv.titlePattern).replaceAll("{commitType}", commitOf(t)).replaceAll("{key}", (S.config?.tracker?.project || "PROJ") + "-123").replaceAll("{summary}", "Reset the password").replaceAll("{type}", t.name);
const field = (label, key, extra = {}) => `<div class="f"><label for="${key}">${label}</label>${extra.hint ? `<span class="hint">${extra.hint}</span>` : ""}<input class="in" id="${key}" data-bind="${key}" type="${extra.type || "text"}" value="${esc(extra.value ?? "")}" ${extra.ph ? `placeholder="${esc(extra.ph)}"` : ""} autocomplete="off"></div>`;

// With a token already in the environment nothing is asked: typing another one is the person's choice.
const tokenField = () => {
  const how = "In Jira, click your picture, then <b>Profile</b>, then <b>Personal Access Tokens</b>, then <b>Create token</b>. Paste it here. It is kept in your Mac's keychain, never in the project and never shared.";
  const input = `<input class="in" id="token" data-bind="token" type="password" autocomplete="off" placeholder="${W.projects !== null && !W.token && !S.tokenInEnv ? "Saved on this computer" : ""}">`;
  const swap = (act, label) => `<button class="btn sm" style="align-self:flex-start" data-act="${act}">${label}</button>`;
  if (!S.tokenInEnv) return `<div class="f"><label for="token">Personal access token</label><span class="hint">${how}</span>${input}</div>`;
  if (W.own) return `<div class="f"><label for="token">Personal access token</label><span class="hint">${how} While <b>LIFTOFF_JIRA_TOKEN</b> is set, it is used instead of the one you type here.</span>${input}${swap("envToken", "Use LIFTOFF_JIRA_TOKEN instead")}</div>`;
  return `<div class="f"><span class="lab">Personal access token</span><div class="note n-ok"><b>A token is already set in LIFTOFF_JIRA_TOKEN.</b> LiftOff uses it: you type nothing, and nothing is saved in the keychain.</div>${swap("ownToken", "Type a different token")}</div>`;
};

// A folder of repositories: what does not work there, and a repository for the setup alone. `again` is the place where
// saving needs it, so it is offered even after "Skip".
const wsView = (again) => {
  const w = S.workspace;
  if (W.wsMade) return `<div class="note n-ok"><b>Configuration repository created.</b> Nothing is committed yet: the last step saves the setup here. To send it to your team, first create an empty project on your GitLab, then run <span class="mono">git remote add origin &lt;its address&gt;</span> in this folder (an engineer can do it).</div>`;
  if (!w || w.isRepo || (w.skipped && !again)) return "";
  const n = w.repos.length;
  const head = again ? "This folder holds several repositories and is not one itself." : `This folder holds ${n === 1 ? "1 repository" : n + " repositories"} and is not one itself.`;
  return `<div class="note n-warn"><b>${head}</b><br>LiftOff is made for one repository (a monorepo): building and merge requests do not work across repositories yet.<br>To share the setup, LiftOff can make this folder a repository for the configuration only: it runs <span class="mono">git init</span>, writes a <span class="mono">.gitignore</span> that ignores everything except the files LiftOff writes (your other files and the repositories stay out), and writes the clone addresses in <span class="mono">WORKSPACE.md</span>. Nothing is committed or sent, and the repositories are not touched.</div>
    ${again ? note() : ""}<div class="row"><button class="btn pri" data-act="wsInit">Create the configuration repository</button>${again ? "" : `<button class="btn" data-act="wsSkip">Skip</button>`}</div>`;
};
const ignoredView = (p) => ((p && p.ignored) || []).length ? `<div class="note n-warn"><b>Ignored by <span class="mono">.gitignore</span>, so not in this save:</b><br>${p.ignored.map((f) => `<span class="mono">${esc(f)}</span>`).join("<br>")}<br>To share one, add a line <span class="mono">!/its/path</span> at the end of <span class="mono">.gitignore</span>.</div>` : "";
const elsewhereView = (p) => {
  const others = ((p && p.elsewhere) || []).filter((e) => !(p.repositories || []).includes(e.repo)); // the workspace's own have their list
  return others.length ? `<div class="note n-info"><b>These files are in other repositories, not in this save. Commit them there:</b><br>${others.map((e) => e.files.map((f) => `<span class="mono">${esc(e.repo + "/" + f)}</span>`).join("<br>")).join("<br>")}</div>` : "";
};

// A workspace: what each repository still has to share of what LiftOff wrote in it. An engineer runs the commands.
const reposView = (list) => {
  if (!(list || []).length) return "";
  const names = (files) => files.map((f) => `<span class="mono">${esc(f)}</span>`).join("<br>");
  const block = (text) => `<pre class="mono" style="white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0">${esc(text)}</pre>`; // wraps on screen only: what is copied keeps its lines
  const repo = (e) => `<div class="note n-info"><b class="mono">${esc(e.repo)}</b>${e.branch ? ` on <span class="mono">${esc(e.branch)}</span>` : ""}
    ${e.warning ? `<br><b>${esc(e.warning)}</b>` : ""}${e.files.length ? `<br>${names(e.files)}` : ""}
    ${e.review.length ? `<br><b>Not in the commands, because they may hold changes of yours:</b><br>${names(e.review)}<br>${e.setup ? `Check them, then commit and push them yourself on <span class="mono">${esc(e.branch)}</span>.` : e.commands ? "Check them, then commit and push them yourself on the new branch, after the commands." : "Check them, then commit and push them yourself."}` : ""}
    ${e.ignored.map((i) => `<br><b>Ignored by <span class="mono">.gitignore</span>, so not in the commands:</b> <span class="mono">${esc(i.file)}</span><br>To share it, add at the end of <span class="mono">${esc(e.repo)}/.gitignore</span>:${block(i.lines.join("\n"))}`).join("")}
    ${e.setup && e.files.length > e.review.length ? `<br>Commit and push what is left on <span class="mono">${esc(e.branch)}</span>.` : ""}
    ${e.unread ? `<br><b><span class="mono">${esc(e.repo)}/.claude/settings.json</span> could not be read</b> (comments, a trailing comma or a typo?), so LiftOff did not switch its plugin on here, and the file is not in the commands. Copy <span class="mono">extraKnownMarketplaces</span> and <span class="mono">enabledPlugins</span> into it from the <span class="mono">.claude/settings.json</span> of this folder, then commit and push it yourself.` : ""}
    ${e.commands ? block(e.commands.join("\n")) : ""}${e.why ? `<br>${esc(e.why)}` : ""}</div>`;
  return `<h2>Share the setup in each repository</h2>
    <p class="hint">For an engineer. LiftOff wrote these files inside the repositories and commits nothing there: each repository needs its own branch and merge request. Type a ticket key to see the commands, to be run in this folder. Paste the lines of one repository together: they stop at the first one that fails. LiftOff runs none of them.</p>
    <div class="row"><input class="in" id="shareKey" data-bind="shareKey" aria-label="Ticket key for the commands" placeholder="Ticket key, such as ${esc(S.config?.tracker?.project || W.project || "PROJ")}-123" value="${esc(W.shareKey || "")}" autocomplete="off"><button class="btn" data-act="showCommands">Show the commands</button></div>
    ${W.shared && W.shared.keyError ? `<div class="note n-warn">${esc(W.shared.keyError)}</div>` : ""}
    ${list.map(repo).join("")}
    <p class="hint">The files are on the new branch only: switching back removes the new ones from the folder until the merge request is merged.<br>The first time the agent starts inside a repository it asks to approve an import from the folder above (the shared rules). Accept it: a refusal is remembered, and the shared rules then never load there.</p>`;
};
// What the save step says about other repositories: the list above, and for any other repository (a submodule) its files.
const reposOf = (p) => reposView(W.shared ? W.shared.onboarding : p && p.onboarding);
const noticesView = (list) => (list || []).map((x) => `<div class="note n-warn">${esc(x)}</div>`).join("");

const byHandView = (list) => (list || []).length ? `<div class="note n-warn"><b>These files were left as they are.</b> LiftOff could not read them (comments, a trailing comma or a typo?), so it did not write over them. Check that each holds what follows:${list.map((x) => `<br><span class="mono">${esc(x.file)}</span><pre class="mono" style="white-space:pre-wrap;word-break:break-all;margin:6px 0">${esc(JSON.stringify(x.add, null, 2))}</pre>`).join("")}</div>` : "";

const VIEWS = {
  welcome() {
    if (W.stage === "po") return `<div class="eyebrow">Welcome</div><h1>Let's set up LiftOff for your project</h1>
      <p class="lede">LiftOff makes your team's AI assistants work the way your team works, and write tickets the way your team writes them.</p>
      <p>You will: <b>describe the project</b>, <b>connect Jira</b> and <b>decide how your tickets are written</b>. It takes about 10 minutes. You do not need to know anything technical: a colleague will take care of that part afterwards.</p>
      <div class="note n-info">Nothing leaves this computer until the last step, where you decide whether to save and share it with your team.</div>${wsView(false)}${W.wsMade ? "" : note()}${nav("next", "Start")}`;
    return `<div class="eyebrow">Welcome back</div><h1>The technical side</h1>
      <p class="lede">The project owner has already described <b>${esc(S.config?.project?.name)}</b> and its Jira tickets (${esc((S.config?.tracker?.issueTypes || []).map((t) => t.name).join(", ") || "no ticket types yet")}).</p>
      <p>Now you confirm what LiftOff found about the code: its parts, the assistants your team uses, how git is used and how the quality bar reads. Everything is a suggestion you can change.</p>${wsView(false)}${W.wsMade ? "" : note()}${nav("next", "Start")}`;
  },
  project() {
    return `<div class="eyebrow">The project</div><h1>What is this project?</h1>
      ${field("Project name", "name", { value: W.name })}
      <div class="f"><label for="purpose">What is it for?</label><span class="hint">One or two sentences. Your team's assistants read this to understand the project.</span><textarea class="in" style="min-height:90px;font-family:inherit" id="purpose" data-bind="purpose">${esc(W.purpose)}</textarea></div>
      ${nav("next", "Continue", W.name.trim() !== "")}`;
  },
  jira() {
    const list = W.projects || [];
    const pick = W.projects !== null && !W.manual;
    const options = list.filter((x) => !W.filter || (x.key + " " + x.name).toLowerCase().includes(W.filter.toLowerCase()));
    return `<div class="eyebrow">Jira</div><h1>Connect to Jira</h1>
      <p class="lede">LiftOff reads your Jira to learn which tickets you use, and later writes tickets there for you, always asking first.</p>
      ${field("Jira address", "url", { value: W.url, ph: "https://jira.yourcompany.com", hint: "The address you type in the browser to open Jira. For example <b>https://jira.yourcompany.com</b>" })}
      ${tokenField()}
      ${note()}
      ${W.local ? `<div class="sub"><b>Is this a Jira on your own computer?</b>
        <span>Jira's security certificate is not known to this computer. For a test Jira that runs on this very computer you can skip that check. For a real company Jira, do not: ask your IT to install the company certificate, or ask the technical lead.</span>
        <div class="row"><button class="btn pri" data-act="local">Yes, it is a local test Jira: skip the check</button></div></div>` : ""}
      ${pick ? `<div class="f"><label for="project">Which Jira project does your team use?</label>
          <span class="hint">These are the projects your token can see. LiftOff uses an existing project and never creates one.</span>
          ${list.length > 8 ? `<input class="in" id="filter" data-bind="filter" placeholder="Search by name or key" value="${esc(W.filter)}">` : ""}
          <select class="in" id="project" data-bind="project"><option value="">Choose a project…</option>${options.map((x) => `<option value="${esc(x.key)}" ${x.key === W.project ? "selected" : ""}>${esc(x.name)} (${esc(x.key)})</option>`).join("")}</select>
          <button class="btn sm" data-act="manual" style="align-self:flex-start">My project is not in the list</button></div>` : ""}
      ${W.manual ? field("Project key", "project", { value: W.project, ph: "PROJ", hint: "The capital letters in front of your ticket numbers: in PROJ-123 it is PROJ." }) : ""}
      <div class="foot"><button class="btn" data-act="back">Back</button>${W.projects !== null ? `<button class="btn pri" data-act="pickProject" ${busy || !W.project ? "disabled" : ""}>${busy ? "One moment…" : "Continue"}</button>` : `<button class="btn pri" data-act="connect" ${busy || !W.url.trim() ? "disabled" : ""}>${busy ? "Checking…" : "Connect"}</button>`}</div>`;
  },
  types() {
    const tl = W.stage === "tl";
    return `<div class="eyebrow">Tickets</div><h1>${tl ? "Which kinds of ticket does your team have?" : "Which kinds of ticket does your team use?"}</h1>
      <p class="lede">${tl ? `These are already set up. You can add the ones Jira has that the team does not use yet, or a kind of your own.` : `These are the ticket types Jira has for ${esc(W.project)}. Pick the ones your team really uses, and add your own if you want one Jira does not have.`}</p>
      ${W.types.map((t, i) => `<div class="opt"><input type="checkbox" data-check="${i}" ${t.on ? "checked" : ""} ${t.locked ? "disabled" : ""}><span style="flex:1"><b>${esc(t.name)}</b>${t.jira ? ` <span class="hint">a ${esc(t.jira)} in Jira</span>` : ""}${t.locked ? ` <span class="hint">already set up</span>` : ""}</span>${!t.locked && t.jira ? `<button class="btn sm" data-act="removeType" data-i="${i}">Remove</button>` : ""}</div>`).join("")}
      ${W.typesNote ? `<div class="note n-warn">${esc(W.typesNote)}</div>` : ""}
      <div class="sub"><b>Add a ticket type of your own</b>
        <span class="hint">For example "e2e" or "support prio". Jira creates it as one of its own types, which you choose here; LiftOff adds a label to tell them apart.</span>
        <div class="row"><div class="f"><label for="addName">Name</label><input class="in" id="addName" data-bind="addName" value="${esc(W.addName)}" placeholder="e2e"></div>
        <div class="f"><label for="addBase">It is a … in Jira</label>${W.found.length ? `<select class="in" id="addBase" data-bind="addBase"><option value="">Choose…</option>${W.found.map((n) => `<option ${n === W.addBase ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>` : `<input class="in" id="addBase" data-bind="addBase" value="${esc(W.addBase)}" placeholder="Task">`}</div></div>
        <button class="btn sm" data-act="addType" style="align-self:flex-start">Add this type</button></div>
      ${note()}${nav("next", "Continue", W.types.some((t) => t.on))}`;
  },
  templates() {
    const on = W.types.filter((t) => t.on && !t.locked);
    return `<div class="eyebrow">Tickets</div><h1>How should each ticket be written?</h1>
      <p class="lede">A template is the list of sections a ticket has. When anyone asks their assistant to write a ticket, it follows this. One section must hold the <b>acceptance criteria</b>: what has to be true for the ticket to be done.</p>
      ${note()}
      ${on.map((t) => { const i = W.types.indexOf(t), h = heads(t.template); return `<div class="sub"><b>${esc(t.name)}</b>
        <div class="f"><label>Start from</label>

        <div class="note n-ok">Your setup is in ${r.first ? "the first commit, on" : "the branch"} <b>${esc(r.branch)}</b>${r.pushed ? ", pushed to your team's repository" : ""}.${r.note ? " " + esc(r.note) : ""}</div>${left}${elsewhereView(p)}${ignoredView(p)}${reposOf(p)}
        <p>${r.first ? (st === "po" ? "Next: ask the technical lead to open this repository with LiftOff to finish the technical part." : "Next: your team gets it by cloning this repository.") : st === "po" ? "Next: ask the technical lead to open this project with LiftOff to finish the technical part. They will also review your branch and merge it, which is how the team gets it." : "Next: open a merge request for this branch. When it is merged, the whole team can use LiftOff."}</p>

    if (!p) return `<h1>Almost there</h1>${left}<p>Loading…</p>`;

      <p>${p.first ? `These files become the repository's <b>first commit</b>, on <span class="mono">${esc(p.branch)}</span>${p.remote ? ", and are sent to your team's repository" : ""}.` : `These files will be saved on a <b>new branch</b> called <span class="mono">${esc(p.branch)}</span>${p.remote ? " and sent to your team's repository" : ""}. The branch your team works on is not touched, and nothing is merged: your colleagues review it first.`}</p>
      ${p.files.length ? `<ul class="files">${p.files.map((f) => `<li class="mono">${esc(f)}</li>`).join("")}</ul>` : `<div class="note n-info">There is nothing new to save.</div>`}
      ${p.remote ? "" : `<div class="note n-warn">This project has no shared repository set up yet (no “origin”), so the branch will be saved here only.</div>`}

      ${note()}

  },
  done() {
    return `<div class="eyebrow">All set</div><h1>Setup is complete</h1><p>Both parts of the setup are done. Your team can use LiftOff.</p><p><a href="/?t=${TOKEN}&view=panel">Open the control panel</a> to change settings later.</p>`;

function render() {
  const app = document.getElementById("app");
  if (W.saveOnly) { document.getElementById("dots").innerHTML = ""; app.innerHTML = VIEWS.save(); return; }
  if (W.stage === "done") { document.getElementById("dots").innerHTML = ""; app.innerHTML = VIEWS.done(); return; }
  dots();
  app.innerHTML = VIEWS[steps()[step]]();
}

// ---------- actions
const say = (kind, text) => { msg = { kind, text }; };
// A ticket type with the template and settings its name suggests; `jiraType` is the Jira type it is created as (a team's own name, like "e2e", for a Task).
function mkType(name, jiraType) {
  const base = jiraType || name, template = S.templates[base.toLowerCase() in S.templates ? base.toLowerCase() : "task"], commit = guessCommit(name);
  return { name, jira: jiraType && jiraType.toLowerCase() !== name.toLowerCase() ? jiraType : "", on: true, locked: false, src: "default", template, ac: guessAc(template), commit, branch: branchOf(commit), key: "", own: "" };
}
// The types the team already has in liftoff.yaml: shown, not rewritten here (a change to one is the control panel's job).
const fromConfigTypes = () => ((S.config && S.config.tracker && S.config.tracker.issueTypes) || []).map((t) => ({ name: t.name, jira: t.jiraType || "", on: true, locked: true, src: "default", template: t.template || "", ac: (t.readingMap && t.readingMap.acceptanceCriteria && t.readingMap.acceptanceCriteria.heading) || "", commit: commitOf(t), branch: t.branchType || branchOf(commitOf(t)), key: "", own: "" }));
function prepareTypes(found) {
  const wanted = /^(story|task|bug|epic)$/i, known = found.filter((n) => wanted.test(n));
  W.types = found.map((name) => Object.assign(mkType(name, ""), { on: known.length ? wanted.test(name) : true }));
}

const ACTS = {
  back() { step = Math.max(0, step - 1); msg = null; W.later = false; },
  async next() {
    step++; msg = null;
    if (steps()[step] === "review") { // say which files will be created, before creating them
      const left = W.excl.length ? { workspace: { exclude: W.excl } } : S.config && S.config.workspace ? { workspace: null } : {};
      const r = await api("POST", "/api/validate", { patch: W.stage === "tl" ? { modules: { items: W.modules.map((m) => ({ id: m.id, path: m.path })) }, ...left } : {} });
      W.creates = r.creates || [];
    }
    if (W.stage === "tl" && steps()[step] === "types" && !W.loadedTl) { // the lead's machine may have no token: then the Jira type is typed
      W.loadedTl = true;
      const r = await api("POST", "/api/jira/types", { url: S.config.tracker.url, project: S.config.tracker.project });
      if (r.ok) { W.found = r.issueTypes; for (const n of r.issueTypes) if (!W.types.some((t) => t.name.toLowerCase() === n.toLowerCase())) W.types.push(Object.assign(mkType(n, ""), { on: false })); }
      else W.typesNote = "Jira could not be reached from this computer (" + (r.message || "no token") + "). You can still add a type of your own: type the Jira type it is.";
    }
  },
  addType() {
    const name = W.addName.trim(), base = W.addBase.trim();
    if (!name || name.length > 80) return say("warn", "Give the new type a name.");
    if (!base) return say("warn", "Say which Jira type it is created as.");
    if (W.types.some((t) => t.name.toLowerCase() === name.toLowerCase())) return say("warn", "There is already a type with that name.");
    W.types.push(mkType(name, base)); W.addName = ""; W.addBase = ""; say("ok", `Added ${name}. Its template comes next.`);
  },
  removeType() { W.types.splice(Number(this.dataset.i), 1); },
  async connect() {
    busy = true; say("info", "Checking Jira…"); render();
    const typed = W.token;
    const r = await api("POST", "/api/jira/projects", { url: W.url, token: typed, insecure: W.insecure });
    busy = false; W.local = false;
    if (r.ok) {
      W.projects = r.projects; W.manual = r.projects.length === 0; W.filter = "";
      if (!r.saved && typed) say("warn", "Connected, but the token could not be saved in the keychain, so keep it at hand.");
      else {
        const then = r.projects.length ? "Now choose the project your team uses." : "This token does not list any project: type the project key.";
        if (S.tokenInEnv && typed) say("warn", "Connected, and the token you typed is saved in your Mac's keychain. LIFTOFF_JIRA_TOKEN is still set and is used instead: remove the variable to use the one you typed. " + then);
        else if (S.tokenInEnv) say("ok", "Connected with the token in LIFTOFF_JIRA_TOKEN. Nothing was saved in the keychain. Claude Code reads the same variable, so it must be set where you start Claude Code. " + then);
        else say("ok", "Connected. " + then);
        W.token = ""; W.own = false;
      }
    } else if (r.code === "untrusted-local") { W.local = true; say("warn", r.message); }
    else say(r.code === "untrusted-cert" || r.code === "cert-problem" ? "warn" : "bad", r.message || "Could not connect.");
  },
  async local() { W.insecure = true; await ACTS.connect(); },
  ownToken() { W.own = true; msg = null; },
  envToken() { W.own = false; W.token = ""; msg = null; },
  manual() { W.manual = true; W.projects = W.projects || []; },
  async pickProject() {
    busy = true; say("info", "Reading the ticket types…"); render();
    const r = await api("POST", "/api/jira/types", { url: W.url, project: W.project, token: W.token, insecure: W.insecure });
    busy = false;
    if (!r.ok) return say(r.code === "untrusted-cert" || r.code === "cert-problem" ? "warn" : "bad", r.message || "Could not read Jira.");
    W.found = r.issueTypes; W.token = "";
    if (!W.types.length || W.typesFor !== W.project) { prepareTypes(r.issueTypes); W.typesFor = W.project; }
    msg = null; step++;
  },
  async sample() {
    const i = Number(this.dataset.i), t = W.types[i];
    const r = await api("POST", "/api/jira/sample", { url: W.url, key: t.key.trim().toUpperCase() });
    if (!r.ok) return say("bad", r.message);
    if (!r.headings.length) return say("warn", "That ticket has no sections to learn from. Try another ticket, or write your own sections.");
    t.template = r.headings.map((h) => `## ${h}\n\n`).join(""); t.ac = guessAc(t.template); say("ok", `Took ${r.headings.length} sections from ${t.key.toUpperCase()}.`);
  },
  own() {
    const t = W.types[Number(this.dataset.i)], h = csv(t.own);
    if (!h.length) return say("warn", "Type at least one section name.");
    t.template = h.map((x) => `## ${x}\n\n`).join(""); t.ac = guessAc(t.template); msg = null;
  },
  addmod() { W.modules.push({ id: "", path: "", languages: "", frameworks: "", build: "", test: "", lint: "" }); },
  rm() { W.modules.splice(Number(this.dataset.i), 1); },
  async create() {
    busy = true; say("info", "Creating the files…"); render();
    const r = W.stage === "po"
      ? await api("POST", "/api/setup/po", { name: W.name, purpose: W.purpose, url: W.url, project: W.project, insecure: W.insecure, types: W.types.filter((t) => t.on).map((t) => ({ name: t.name, jiraType: t.jira || undefined, template: t.template, ac: t.ac, branch: t.branch, commit: t.commit })) })
      : await api("POST", "/api/setup/tl", { modules: W.modules.map((m) => ({ id: m.id, path: m.path, languages: csv(m.languages), frameworks: csv(m.frameworks), build: m.build, test: m.test, lint: m.lint })), languages: csv(W.languages), frameworks: csv(W.frameworks), targets: W.targets, exclude: W.excl, git: W.git, host: W.host, conventions: { targetBranch: W.conv.targetBranch, branchPattern: W.conv.branchPattern, titlePattern: W.conv.titlePattern, labels: csv(W.conv.labels), reviewers: csv(W.conv.reviewers) }, constraintsText: constraints, brain: W.brain, types: W.types.filter((t) => t.on && !t.locked).map((t) => ({ name: t.name, jiraType: t.jira || undefined, template: t.template, ac: t.ac, branch: t.branch, commit: t.commit })) });
    busy = false;
    if (!r.ok) return say("bad", r.errors ? r.errors.map((e) => e.message).join("; ") : r.message || "Something went wrong.");
    W.created = r; msg = null; step++;
    W.preview = null; render();
    W.preview = await api("POST", "/api/save/preview", { stage: W.stage });
  },
  async save() {
    busy = true; msg = null; render();
    const r = await api("POST", "/api/save", { stage: W.saveStage || W.stage, files: W.preview.files });
    busy = false;
    if (r.ok) W.saved = r; else say("bad", r.message || "Could not save.");
  },
  async wsInit() {
    const r = await api("POST", "/api/workspace/init", {});
    if (!r.ok) return say("bad", r.message || "That did not work.");
    S.workspace = r.workspace; W.wsMade = true; msg = null;
    if (W.preview) W.preview = await api("POST", "/api/save/preview", { stage: W.saveStage || W.stage });
  },
  async wsSkip() {
    const r = await api("POST", "/api/workspace/skip", {});
    if (r.ok) S.workspace = r.workspace; else say("bad", r.message || "That did not work.");
  },
  async showCommands() {
    const r = await api("POST", "/api/workspace/share", { key: (W.shareKey || "").trim() });
    if (r.ok) W.shared = r; else say("bad", r.message || "That did not work.");
  },
  later() { if (W.saveOnly) { W.saveOnly = false; msg = null; } else W.later = true; },
  saveNow() { W.later = false; msg = null; },
};

const app = document.getElementById("app");
app.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  await ACTS[b.dataset.act].call(b);
  render();
});
// Typing does not redraw the page (that would take the cursor and the scroll away), but a button that waits for a field
// must wake up, or go back to sleep, as the field is filled or emptied: so after every edit the buttons are set again
// from what the screen would say now.
function redrawKeepingFocus() {
  const a = document.activeElement, id = a && a.id, from = a && a.selectionStart, to = a && a.selectionEnd;
  render();
  const el = id && document.getElementById(id);
  if (el && el.focus) { el.focus(); try { if (from != null) el.setSelectionRange(from, to); } catch (_) { /* no cursor */ } }
}
function syncButtons() {
  const view = W.saveOnly ? "save" : steps()[step];
  if (!VIEWS[view] || !app.querySelectorAll) return;
  const want = {};
  for (const m of VIEWS[view]().matchAll(/<button\b([^>]*)>/g)) { const act = /data-act="(\w+)"/.exec(m[1]); if (act) want[act[1]] = /\sdisabled(\s|=|$)/.test(m[1]); }
  for (const b of app.querySelectorAll("button[data-act]")) if (b.dataset.act in want) b.disabled = want[b.dataset.act];
}
app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.bind) { if (t.dataset.bind === "constraints") constraints = t.value; else W[t.dataset.bind] = t.value; }
  else if (t.id && t.id.startsWith("c.")) W.conv[t.id.slice(2)] = t.value;
  else if (t.dataset.tbind) { const [i, k] = t.dataset.tbind.split("."); W.types[Number(i)][k] = t.value; if (k === "template") { const ty = W.types[Number(i)]; if (!heads(ty.template).includes(ty.ac)) ty.ac = guessAc(ty.template); } if (k === "commit") W.types[Number(i)].branch = branchOf(t.value); }
  else if (t.dataset.mbind) { const [i, k] = t.dataset.mbind.split("."); W.modules[Number(i)][k] = t.value; }
  else if (t.id && t.id in W && typeof W[t.id] === "string") W[t.id] = t.value;
  if (t.dataset.bind === "filter") redrawKeepingFocus(); // the list narrows as you type
  syncButtons(); // the buttons that wait for this field; the section list of a template refreshes on change, to keep the cursor
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.check !== undefined) W.types[Number(t.dataset.check)].on = t.checked;
  else if (t.dataset.src !== undefined) { W.types[Number(t.dataset.src)].src = t.value; }
  else if (t.dataset.target) { W.targets = t.checked ? [...new Set([...W.targets, t.dataset.target])] : W.targets.filter((x) => x !== t.dataset.target); }
  else if (t.dataset.git !== undefined) W.git = t.value;
  else if (t.dataset.repo !== undefined) W.excl = t.checked ? W.excl.filter((x) => x !== t.dataset.repo) : [...new Set([...W.excl, t.dataset.repo])].sort();
  else if (t.dataset.brain !== undefined) W.brain = t.value;
  else if (t.dataset.lessons !== undefined) W.brain = t.checked ? "lessons" : "on";
  else if (t.dataset.tbind && t.dataset.tbind.endsWith(".template")) { /* fall through to render */ }
  else if (t.dataset.tbind && t.dataset.tbind.endsWith(".ac")) return;
  else return;
  render();
});

(async function start() {
  const s = await api("GET", "/api/setup");
  if (!s.ok) { app.textContent = s.message || "Could not load."; return; }
  init(s);
  if (s.stage === "tl") { const st = await api("GET", "/api/state"); constraints = st.constraints?.text || ""; }
  if (s.unsaved && s.unsaved.length > 0) { // the setup was written but never saved: offer it again before anything else
    W.saveOnly = true; W.saveStage = s.stage === "done" ? "tl" : "po";
    W.preview = await api("POST", "/api/save/preview", { stage: W.saveStage });
  }
  render();
})();
</script>
</body>
</html>
