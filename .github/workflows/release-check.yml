name: Release check

# A release tag is what teammates pin to (extraKnownMarketplaces `ref`), so a tag whose artifact is stale or whose
# version disagrees with its name must be caught at once. If this fails, delete the tag before anyone pins it:
#   git push origin :refs/tags/vX.Y.Z && git tag -d vX.Y.Z

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: The tag, package.json and plugin.json name the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          plugin="$(node -p "require('./plugin/.claude-plugin/plugin.json').version")"
          echo "tag=$tag package.json=$pkg plugin.json=$plugin"
          test "$tag" = "$pkg" && test "$tag" = "$plugin"
      - run: npm ci
      - run: npm run build
      - name: The committed artifact equals a fresh build
        run: git diff --exit-code -- plugin
      - run: npm test
